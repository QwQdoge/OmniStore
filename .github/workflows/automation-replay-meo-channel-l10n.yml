name: Temporary Meo channel l10n replay

on:
  push:
    branches:
      - automation/l10n-meo-channel-clean
    paths:
      - '.github/workflows/automation-replay-meo-channel-l10n.yml'

permissions:
  contents: write

jobs:
  replay-generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out replay branch
        uses: actions/checkout@v6
        with:
          ref: automation/l10n-meo-channel-clean
          fetch-depth: 0

      - name: Apply clean source replay
        run: python3 .github/automation/replay_meo_channel_l10n.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve and regenerate localizations
        working-directory: FlutterUI
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Verify changed Dart formatting
        working-directory: FlutterUI
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/settings/presentation/widgets/meo_channel_card.dart \
            lib/l10n/app_localizations.dart \
            lib/l10n/app_localizations_en.dart \
            lib/l10n/app_localizations_es.dart \
            lib/l10n/app_localizations_ja.dart \
            lib/l10n/app_localizations_zh.dart

      - name: Commit replay and remove temporary automation files
        run: |
          git rm .github/workflows/automation-replay-meo-channel-l10n.yml .github/automation/replay_meo_channel_l10n.py
          git add \
            FlutterUI/lib/features/settings/presentation/widgets/meo_channel_card.dart \
            FlutterUI/lib/l10n/app_en.arb \
            FlutterUI/lib/l10n/app_es.arb \
            FlutterUI/lib/l10n/app_ja.arb \
            FlutterUI/lib/l10n/app_zh.arb \
            FlutterUI/lib/l10n/app_zh_Hant.arb \
            FlutterUI/lib/l10n/app_localizations.dart \
            FlutterUI/lib/l10n/app_localizations_en.dart \
            FlutterUI/lib/l10n/app_localizations_es.dart \
            FlutterUI/lib/l10n/app_localizations_ja.dart \
            FlutterUI/lib/l10n/app_localizations_zh.dart
          unexpected="$(git diff --cached --name-only | grep -Ev '^(FlutterUI/lib/features/settings/presentation/widgets/meo_channel_card\.dart|FlutterUI/lib/l10n/app_(en|es|ja|zh|zh_Hant)\.arb|FlutterUI/lib/l10n/app_localizations(_en|_es|_ja|_zh)?\.dart|\.github/workflows/automation-replay-meo-channel-l10n\.yml|\.github/automation/replay_meo_channel_l10n\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if ! git diff --quiet -- FlutterUI/pubspec.lock; then
            echo 'flutter pub get unexpectedly modified pubspec.lock' >&2
            git diff -- FlutterUI/pubspec.lock >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'i18n: localize Meo update channel controls'
          git push origin HEAD:automation/l10n-meo-channel-clean

# One-shot maintenance workflow; it deletes itself after generating the clean replay.
