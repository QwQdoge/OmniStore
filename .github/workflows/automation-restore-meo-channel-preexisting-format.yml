name: Temporary restore pre-existing Meo channel formatting

on:
  push:
    branches:
      - automation/l10n-meo-channel-clean
    paths:
      - '.github/workflows/automation-restore-meo-channel-preexisting-format.yml'

permissions:
  contents: write

jobs:
  restore-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/l10n-meo-channel-clean
      - name: Restore unrelated pre-existing wrapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('FlutterUI/lib/features/settings/presentation/widgets/meo_channel_card.dart')
          text = path.read_text()
          old = "          'error': 'The Stable rollback preview is invalid. Refresh and review it again.',\n"
          new = "          'error':\n              'The Stable rollback preview is invalid. Refresh and review it again.',\n"
          if text.count(old) != 1:
              raise SystemExit('expected formatted line exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit clean diff and remove temporary workflow
        run: |
          git rm .github/workflows/automation-restore-meo-channel-preexisting-format.yml
          git add FlutterUI/lib/features/settings/presentation/widgets/meo_channel_card.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: preserve pre-existing Meo channel formatting'
          git push origin HEAD:automation/l10n-meo-channel-clean
