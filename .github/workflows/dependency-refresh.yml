name: Dependency refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out dependency branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply current-major migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('FlutterUI/lib/features/home/home_page.dart')
          text = home.read_text()
          old = """    FilePickerResult? result = await FilePicker.pickFiles(\n      type: FileType.custom,\n      allowedExtensions: ['txt', 'json'],\n    );\n\n    if (!mounted) return;\n\n    if (result != null) {\n      final path = result.files.single.path!;\n      final packages = await packageRepo.importPackages(path);\n"""
          new = """    final files = await FilePicker.pickFiles(\n      type: FileType.custom,\n      allowedExtensions: ['txt', 'json'],\n    );\n\n    if (!mounted) return;\n\n    if (files.isNotEmpty) {\n      final path = files.single.path;\n      if (path == null) return;\n      final packages = await packageRepo.importPackages(path);\n"""
          if old in text:
              home.write_text(text.replace(old, new, 1))
          elif 'FilePickerResult?' in text:
              raise SystemExit('file_picker v12 migration pattern changed unexpectedly')

          regression = Path('python/tests/test_runtime_regressions.py')
          text = regression.read_text()
          stale = '    assert any("disabled" in message.lower() for message in messages)\n'
          if stale in text:
              regression.write_text(text.replace(stale, '', 1))
          PY

      - name: Resolve latest Flutter dependencies
        working-directory: FlutterUI
        run: |
          flutter --version
          flutter pub upgrade --major-versions
          flutter pub outdated || true

      - name: Analyze and test Flutter
        working-directory: FlutterUI
        run: |
          flutter analyze
          flutter test

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake libayatana-appindicator3-dev libgtk-3-dev \
            liblzma-dev libsecret-1-dev ninja-build pkg-config

      - name: Build Flutter Linux release
        working-directory: FlutterUI
        run: flutter build linux --release

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Refresh Python requirements to latest stable
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          path = Path('python/requirements.txt')
          out = []
          pattern = re.compile(r'^(?P<name>[A-Za-z0-9_.-]+)(?P<extras>\[[^]]+\])?\s*(?P<op>==|>=|~=|<=|>|<)\s*(?P<version>[^\s#]+)(?P<tail>\s*(?:#.*)?)$')
          for raw in path.read_text().splitlines():
              m = pattern.match(raw.strip())
              if not m:
                  out.append(raw)
                  continue
              package = m.group('name')
              with urllib.request.urlopen(f'https://pypi.org/pypi/{package}/json', timeout=20) as response:
                  latest = json.load(response)['info']['version']
              prefix = package + (m.group('extras') or '')
              tail = m.group('tail') or ''
              out.append(f'{prefix}=={latest}{tail}')
          path.write_text('\n'.join(out) + '\n')
          PY
          python -m pip install -r python/requirements.txt

      - name: Run Python tests
        working-directory: python
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Commit resolved manifests and migrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FlutterUI/pubspec.yaml FlutterUI/pubspec.lock \
            FlutterUI/lib/features/home/home_page.dart \
            python/requirements.txt python/tests/test_meo_channel.py \
            python/tests/test_runtime_regressions.py
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): resolve latest stable dependency set'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
