name: Dependency refresh validation temporary

on:
  push:
    branches:
      - chore/deps-latest-20260831

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libayatana-appindicator3-dev libgtk-3-dev liblzma-dev libsecret-1-dev ninja-build pkg-config
      - name: Verify Flutter resolver is stable
        working-directory: FlutterUI
        run: |
          flutter pub upgrade --major-versions
          git diff --exit-code -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip check
      - name: Run Python tests
        run: python -m pytest -q python/tests
      - name: Analyze Flutter
        working-directory: FlutterUI
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: FlutterUI
        run: flutter test --reporter expanded
      - name: Build Flutter Linux release
        working-directory: FlutterUI
        run: flutter build linux --release
      - name: Record validation success
        run: |
          printf 'validated Flutter 3.47.1 and Python 3.14 dependency refresh\n' > .dependency-refresh-validated
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .dependency-refresh-validated
          git commit -m 'ci: record dependency validation success'
          git push
