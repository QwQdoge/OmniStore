name: Temporary pub lock refresh

on:
  push:
    branches:
      - deps/temp-pub-lock-refresh-20261027

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: legacy/flutter-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve latest compatible transitive package
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          text = p.read_text()
          needle = "dependency_overrides:\n  uuid: ^4.6.0"
          assert needle in text, "Expected existing uuid override was not found"
          p.write_text(text.replace(
              needle,
              "dependency_overrides:\n  shared_preferences_foundation: ^2.6.0\n  uuid: ^4.6.0",
              1,
          ))
          PY
          flutter pub get
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          flutter pub get
          grep -A7 '^  shared_preferences_foundation:' pubspec.lock
          grep -A6 '^  objective_c:' pubspec.lock
          grep -q 'version: "2.6.0"' <(sed -n '/^  shared_preferences_foundation:/,/^  [^ ]/p' pubspec.lock)

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "deps(flutter): refresh shared_preferences_foundation lock"
          git push

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-pubspec-lock
          path: legacy/flutter-ui/pubspec.lock
          if-no-files-found: error
