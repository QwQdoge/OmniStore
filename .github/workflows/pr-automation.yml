name: PR automation

# Owner PRs are intentionally not auto-merged while the default-branch ruleset
# lacks required status checks and a merge queue/up-to-date requirement.
# GitHub's merge API pins the PR head but not the base SHA, so a separate
# base check followed by merge has a TOCTOU window.
# Re-enable owner auto-merge only after a merge queue and required checks are
# enforced by the repository ruleset.
#
# External PRs are labeled and greeted only; no PR code is checked out.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  external:
    if: github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label and greet
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label external
          if [[ "$ACTION" == "opened" ]]; then
            gh pr comment "$PR_URL" --body "Thanks for the contribution! The maintainer reviews external PRs manually, so please allow some time. Make sure CI passes and the PR checklist is filled in."
          fi
