name: Maintenance resolve Flutter lock

on:
  push:
    branches:
      - maintenance/flutter-lock-refresh-20260828

permissions:
  contents: write

jobs:
  resolve-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v6
        with:
          ref: maintenance/flutter-lock-refresh-20260828

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve lockfile with repository Flutter SDK
        working-directory: FlutterUI
        run: flutter pub get

      - name: Keep the generated change limited to the lockfile
        run: |
          git restore -- FlutterUI/analysis_options.yaml 2>/dev/null || true
          if git diff --quiet -- FlutterUI/pubspec.lock; then
            echo 'Lockfile already matches Flutter 3.47.1 resolution.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FlutterUI/pubspec.lock
          git commit -m 'chore(deps): refresh Flutter lockfile'
          git push origin HEAD:maintenance/flutter-lock-refresh-20260828
