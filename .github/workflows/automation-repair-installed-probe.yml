name: Temporary installed-state probe repair

on:
  push:
    branches:
      - automation/repair-installed-state-probe
    paths:
      - '.github/workflows/automation-repair-installed-probe.yml'

permissions:
  contents: write

jobs:
  repair-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: automation/repair-installed-state-probe
          fetch-depth: 0

      - name: Apply minimal repair
        run: |
          sed -i 's/if count != 1:/if count < 1:/' .github/automation/repair_installed_probe.py
          python3 .github/automation/repair_installed_probe.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Verify focused regression tests
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pytest -q tests/test_external_sources_installed_probe.py

      - name: Commit repair and remove temporary automation files
        run: |
          git rm .github/workflows/automation-repair-installed-probe.yml
          git rm -f .github/automation/repair_installed_probe.py
          git add python/core/sources/external.py python/tests/test_external_sources_installed_probe.py
          unexpected="$(git diff --cached --name-only | grep -Ev '^(python/core/sources/external\.py|python/tests/test_external_sources_installed_probe\.py|\.github/workflows/automation-repair-installed-probe\.yml|\.github/automation/repair_installed_probe\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: preserve installed state during lightweight package search'
          git push origin HEAD:automation/repair-installed-state-probe
