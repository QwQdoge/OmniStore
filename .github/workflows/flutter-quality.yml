name: Flutter quality

on:
  pull_request:
    paths:
      - 'FlutterUI/**'
      - '.github/workflows/flutter-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'FlutterUI/**'
      - '.github/workflows/flutter-quality.yml'

permissions:
  contents: write

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Analyze, test, and build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: FlutterUI

    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit resolver lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh pub lockfile"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Linux release
        run: flutter build linux --release
