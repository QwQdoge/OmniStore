name: Flutter legacy quality

on:
  pull_request:
    paths:
      - 'legacy/flutter-ui/**'
      - '.github/workflows/flutter-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'legacy/flutter-ui/**'
      - '.github/workflows/flutter-quality.yml'

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Legacy Flutter analyze, test, and build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: legacy/flutter-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Linux release
        run: flutter build linux --release
