name: Temporary Flutter dependency resolution
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-resolve-flutter-lock.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies with the CI Flutter SDK
        working-directory: legacy/flutter-ui
        run: flutter pub get
      - name: Commit the resolved lockfile
        run: |
          if ! git diff --quiet -- legacy/flutter-ui/pubspec.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add legacy/flutter-ui/pubspec.lock
            git commit -m "chore(deps): resolve Flutter lockfile on CI SDK"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
