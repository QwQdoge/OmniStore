name: frontend
description: "A new Flutter project."
publish_to: 'none'

# =========================================================
# ⚠️ WARNING TO AI / DEVELOPER:
# 1. Keep direct dependencies on the latest stable versions supported by the
#    current stable Flutter/Dart toolchain. Raise the SDK baseline when a
#    stable dependency requires it; do not downgrade to preserve an old baseline.
# 2. 'flutter_markdown' is DISCONTINUED. We are strictly using
#    'flutter_markdown_plus'. DO NOT change it back to the old package.
# =========================================================

version: 0.1.3+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Storage
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

  # UI & Media
  flutter_markdown_plus: ^1.0.12
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9

  # Desktop & OS Integration
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  system_tray: ^2.0.3
  flutter_local_notifications: ^22.3.0
  file_picker: ^12.1.1

  # Network & Core Utilities
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  supabase_flutter: ^2.17.2
  app_links: ^7.2.1
  crypto: ^3.0.7
  dbus: ^0.7.14
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.6
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/app_icon.png
